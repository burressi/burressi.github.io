<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Accolades, awards, certifications, and media features for Ian Burress." />
  <title>Ian Burress - 404</title>

  <link rel="icon" type="image/png" href="icons/ClearWLogo.png" />

  <!-- FIXED Google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=5" />

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    main {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .error-wrapper {
      display: flex;
      max-width: 1000px;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .error-text {
      flex: 1;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 700;
      color: #0077cc;
      margin-bottom: 10px;
    }

    .error-text h1 {
      margin: 0 0 10px;
    }

    .error-text p {
      margin: 0 0 20px;
      color: #475569;
    }

    .funny-line {
      font-style: italic;
    }

    .home-button {
      display: inline-block;
      padding: 12px 20px;
      background: #0077cc;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }

    .home-button:hover {
      background: #005fa3;
    }

    .error-image {
      flex: 1;
      text-align: center;
    }

    .error-image img {
      max-width: 100%;
      border-radius: 10px;
    }

    @media (max-width: 768px) {
      .error-wrapper {
        flex-direction: column;
        text-align: center;
      }

      .error-code {
        font-size: 4rem;
      }
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header id="mainHeader" class="sticky-nav">
  <div class="header-container">

    <div class="headerLeft">
      <a href="https://www.linkedin.com" target="_blank">
        <img class="sidebarIcon icon" src="icons/linkedin.png" alt="LinkedIn">
      </a>

      <a href="https://github.com" target="_blank">
        <img class="sidebarIcon icon" src="icons/github.png" alt="GitHub">
      </a>

      <a href="mailto:ian.n.burress@gmail.com">
        <img class="sidebarIcon icon" src="icons/email.png" alt="Email">
      </a>
    </div>

    <div class="headerCenter">
      <a href="index.html">
        <img src="icons/ClearBlack2.png" alt="Logo" id="headerLogo">
      </a>
    </div>

    <nav class="headerRight header-links">
      <a href="about.html">About Me</a>
      <a href="projects1.html">Projects</a>
      <a href="accolades.html">Accolades</a>
      <a href="contact.html" class="btn-primary-nav">Contact</a>
    </nav>

  </div>
</header>

<main>
  <div class="error-wrapper">

    <div class="error-text">
      <div class="error-code">404</div>

      <h1>This page pulled a Homer.</h1>

      <p>
        The page you’re looking for doesn’t exist… or quietly backed into the bushes.
      </p>

      <p class="funny-line">
        Don’t worry — I get lost sometimes too.
      </p>

      <a href="index.html" class="home-button">Take me home</a>
    </div>


    <div class="error-image">
      <img src="pictures/simpson.gif" alt="Homer backing into bushes">
    </div>

  </div>
</main>

<footer>
  <p>© Ian Burress 2026</p>
</footer>

</body>
</html>
