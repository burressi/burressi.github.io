  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }

    main {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .error-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1000px;
      gap: 40px;
      width: 100%;
    }

    /* Left side (text) */
    .error-text {
      flex: 1;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: #0077cc;
      margin-bottom: 10px;
    }

    .error-text h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .error-text p {
      margin-bottom: 20px;
      color: #475569;
      line-height: 1.5;
    }

    .funny-line {
      font-style: italic;
      margin-bottom: 25px;
    }

    .home-button {
      display: inline-block;
      padding: 12px 20px;
      background-color: #0077cc;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .home-button:hover {
      background-color: #005fa3;
    }

    /* Right side (GIF) */
    .error-image {
      flex: 1;
      text-align: center;
    }

    .error-image img {
      max-width: 100%;
      border-radius: 10px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .error-wrapper {
        flex-direction: column;
        text-align: center;
      }

      .error-code {
        font-size: 4rem;
      }
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
