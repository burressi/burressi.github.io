<!DOCTYPE html>
<html lang="en">

<head>

  <title>Ian Burress - 404</title>

  <link rel="icon" type="image/png" href="icons/ClearWLogo.png" />

  <!-- FIXED Google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=5" />

  <style>
    .error-layout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 60px;
  max-width: 1100px;
  margin: 0 auto;
}

.error-text-block {
  flex: 1;
}

.error-image-block {
  flex: 1;
  text-align: center;
}

.error-image-block img {
  max-width: 100%;
  border-radius: 8px;
}

/* Match your typography scale */
.error-code {
  font-size: 5rem;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-weight: 700;
}

/* Mobile responsiveness (matches your pattern) */
@media (max-width: 850px) {
  .error-layout {
    flex-direction: column;
    text-align: center;
  }
}
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    main {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .error-wrapper {
      display: flex;
      max-width: 1000px;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .error-text {
      flex: 1;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 700;
      color: #0077cc;
      margin-bottom: 10px;
    }

    .error-text h1 {
      margin: 0 0 10px;
    }

    .error-text p {
      margin: 0 0 20px;
      color: #475569;
    }

    .funny-line {
      font-style: italic;
    }

    .home-button {
      display: inline-block;
      padding: 12px 20px;
      background: #0077cc;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }

    .home-button:hover {
      background: #005fa3;
    }

    .error-image {
      flex: 1;
      text-align: center;
    }

    .error-image img {
      max-width: 100%;
      border-radius: 10px;
    }

    @media (max-width: 768px) {
      .error-wrapper {
        flex-direction: column;
        text-align: center;
      }

      .error-code {
        font-size: 4rem;
      }
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header id="mainHeader" class="sticky-nav">
  <div class="header-container">

    <div class="headerLeft">
      <a href="https://www.linkedin.com" target="_blank">

      </a>

        <img class="sidebarIcon icon" src="icons/email.png" alt="Email">
      </a>
    </div>

    <div class="headerCenter">
      <a href="index.html">

  </div>

<main>

    <div class="error-layout">

      <!-- LEFT: TEXT -->
      <div class="error-text-block">
        <h1 class="error-code">404</h1>

        <h2 class="section-title" style="margin-bottom: 15px;">
          This page pulled a Homer.
        </h2>

        <p class="intro-text" style="max-width: 500px; margin: 0 auto 20px;">
          The page you’re looking for doesn’t exist, was deleted, or quietly backed into the bushes.
        </p>

        <p style="margin-bottom: 30px; color: var(--text-light);">
          Don’t worry — I get lost sometimes too.
        </p>

        <a href="index.html" class="btn-primary">Take me home</a>
      </div>

      <!-- RIGHT: IMAGE -->
      <div class="error-image-block">
        <img src="pictures/simpson.gif" alt="Homer Simpson backing into bushes">
      </div>

    </div>

  </section>

</main>

<footer>
  <p>© Ian Burress 2026</p>
</footer>
